<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Head Hunters | Recruitment & Executive Search Sri Lanka</title>
    <meta name="description" content="Head Hunters is a Sri Lankan recruitment agency and executive-search firm based in Colombo. We provide permanent recruitment, confidential senior appointments, executive search, and strategic workforce solutions across Sri Lanka." />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://www.headhunters.lk/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Head Hunters" />
    <meta property="og:title" content="Head Hunters | Recruitment & Executive Search Sri Lanka" />
    <meta property="og:description" content="Head Hunters is a Sri Lankan recruitment agency and executive-search firm based in Colombo. Permanent recruitment, confidential senior appointments, and workforce solutions across Sri Lanka." />
    <meta property="og:url" content="https://www.headhunters.lk/" />
    <meta property="og:image" content="https://www.headhunters.lk/og-image.png" />
    <meta property="og:locale" content="en_LK" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Head Hunters | Recruitment Agency & Executive Search — Sri Lanka" />
    <meta name="twitter:description" content="Sri Lanka's recruitment agency and executive-search firm. Permanent recruitment, confidential senior appointments, and workforce solutions." />
    <meta name="twitter:image" content="https://www.headhunters.lk/og-image.png" />

    <!-- Geo / Language -->
    <meta name="geo.region" content="LK-11" />
    <meta name="geo.placename" content="Colombo, Sri Lanka" />
    <meta name="language" content="English" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Organization + EmploymentAgency JSON-LD
         REQUIRED BEFORE DEPLOY:
         - Confirm primary telephone and add:  "telephone": "+94 XX XXX XXXX"
         - Confirm full address (street number) and update streetAddress
         - Confirm LinkedIn URL and add to sameAs array
         - Confirm Facebook URL and add to sameAs array
         - Confirm whether Head Hunters genuinely serves AU/NZ before adding areaServed -->
    <!-- Organization + EmploymentAgency JSON-LD (Verified facts only) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["Organization", "EmploymentAgency"],
      "@id": "https://www.headhunters.lk/#organization",
      "name": "Head Hunters",
      "url": "https://www.headhunters.lk/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://www.headhunters.lk/favicon.svg"
      },
      "description": "Head Hunters is a Sri Lankan recruitment agency and executive search consultancy in Colombo, Sri Lanka.",
      "email": "info@headhunters.lk",
      "areaServed": {
        "@type": "Country",
        "name": "Sri Lanka"
      }
    }
    </script>

    <!-- WebSite JSON-LD (enables Sitelinks Search Box in future) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://www.headhunters.lk/#website",
      "url": "https://www.headhunters.lk/",
      "name": "Head Hunters",
      "description": "Recruitment agency and executive search firm in Colombo, Sri Lanka",
      "publisher": { "@id": "https://www.headhunters.lk/#organization" },
      "inLanguage": "en-LK"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
